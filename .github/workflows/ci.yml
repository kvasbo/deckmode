name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Formatted
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - name: Builds for the Mac
        env:
          CGO_ENABLED: "0"
        run: GOOS=darwin GOARCH=arm64 go build -o /dev/null .
      - name: Shell scripts
        run: shellcheck deploy/install.sh deploy/deckmode-update
