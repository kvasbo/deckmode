name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # Apple silicon, like the Mac it is for, so the binary is run before it is published.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...

      # No cgo anywhere in the dependencies (purego), and Go's linker signs the
      # binary ad hoc, which is all Apple silicon asks of one that curl downloaded.
      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir dist
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o dist/deckmode-darwin-arm64 .
          test "$(dist/deckmode-darwin-arm64 --version)" = "$GITHUB_REF_NAME"

      - name: Pack the installer
        env:
          COPYFILE_DISABLE: "1" # no ._ files in the tarball
        run: |
          mkdir deckmode-deploy
          cp deploy/* config.example.yaml deckmode-deploy/
          cp -r icons deckmode-deploy/
          tar czf dist/deckmode-deploy.tar.gz deckmode-deploy

      - name: Checksums
        working-directory: dist
        run: shasum -a 256 deckmode-darwin-arm64 deckmode-deploy.tar.gz > checksums.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
